name: CI

# Runs on every push to main and on every pull request into main.
# Two independent jobs: the TypeScript frontend, and the Rust backend on a
# real Windows runner (the app is Windows-only, and its Win32 code can only
# be compiled and tested there).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Production build
        run: pnpm exec vite build

  rust:
    name: Rust (Windows, cargo test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo test (library)
        working-directory: src-tauri
        run: cargo test --lib

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets
